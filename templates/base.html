<!DOCTYPE html>
<html class="light {% block html_class %}{% endblock %}" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{% block title %}ChatPulse{% endblock %}</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                "primary-fixed": "#dee1ff",
                "surface-dim": "#dcd9d9",
                "on-primary-container": "#002088",
                "secondary-fixed": "#ccebc2",
                "inverse-on-surface": "#f3f0f0",
                "on-background": "#1b1c1c",
                "primary-container": "#7b8ff7",
                "surface-tint": "#4156ba",
                "on-surface-variant": "#454652",
                "surface-container": "#f0eded",
                "on-surface": "#1b1c1c",
                "inverse-surface": "#303030",
                "on-tertiary-fixed": "#331101",
                "tertiary-container": "#c4896b",
                "tertiary": "#845238",
                "primary": "#4156ba",
                "on-secondary-fixed-variant": "#334d2f",
                "outline-variant": "#c5c5d4",
                "on-error-container": "#93000a",
                "surface-container-high": "#eae8e7",
                "surface": "#fbf9f8",
                "tertiary-fixed-dim": "#f9b898",
                "background": "#fbf9f8",
                "outline": "#757684",
                "on-secondary-container": "#4f6a49",
                "on-tertiary": "#ffffff",
                "on-primary-fixed": "#001159",
                "error": "#ba1a1a",
                "on-secondary-fixed": "#082007",
                "on-tertiary-container": "#4c240e",
                "primary-fixed-dim": "#b9c3ff",
                "surface-container-lowest": "#ffffff",
                "on-tertiary-fixed-variant": "#683b23",
                "surface-bright": "#fbf9f8",
                "on-secondary": "#ffffff",
                "error-container": "#ffdad6",
                "on-error": "#ffffff",
                "surface-container-highest": "#e4e2e1",
                "tertiary-fixed": "#ffdbcb",
                "secondary-fixed-dim": "#b1cfa7",
                "surface-container-low": "#f6f3f2",
                "on-primary-fixed-variant": "#263ca1",
                "inverse-primary": "#b9c3ff",
                "surface-variant": "#e4e2e1",
                "on-primary": "#ffffff",
                "secondary-container": "#c9e8bf",
                "secondary": "#4a6545"
            },
            borderRadius: {
                "DEFAULT": "1rem",
                "lg": "2rem",
                "xl": "3rem",
                "full": "9999px",
                "clay": "28px"
            },
            spacing: {
                "gutter": "24px",
                "unit": "8px",
                "lg": "40px",
                "sm": "12px",
                "margin-desktop": "48px",
                "xl": "64px",
                "md": "24px",
                "margin-mobile": "16px",
                "xs": "4px"
            },
            fontFamily: {
                "headline-xl": ["Quicksand"],
                "label-sm": ["Quicksand"],
                "body-md": ["Quicksand"],
                "body-lg": ["Quicksand"],
                "headline-md": ["Quicksand"],
                "headline-lg": ["Quicksand"]
            },
            fontSize: {
                "headline-xl": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                "label-sm": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "600" }],
                "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "500" }],
                "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "500" }],
                "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }]
            }
        }
    }
}
</script>
<style>
    body { background-color: #fbf9f8; color: #1b1c1c; }
    .clay-shadow { box-shadow: 20px 20px 25px 0px rgba(0,0,0,0.15), -20px -20px 20px 0px rgba(255,255,255,0.6); }
    .clay-shadow-sm { box-shadow: 10px 10px 15px 0px rgba(0,0,0,0.1), -10px -10px 15px 0px rgba(255,255,255,0.5); }
    .clay-shadow-inner { box-shadow: inset 4px 4px 8px rgba(0,0,0,0.1), inset -4px -4px 8px rgba(255,255,255,0.8); }
    .clay-inset { box-shadow: inset 4px 4px 8px rgba(0,0,0,0.1), inset -4px -4px 8px rgba(255,255,255,0.8); }
    .clay-hover:hover { transform: scale(1.02); box-shadow: 25px 25px 30px 0px rgba(0,0,0,0.18), -25px -25px 30px 0px rgba(255,255,255,0.7); transition: all 0.3s ease; }
    .clay-active:active { transform: scale(0.95); }
    .clay-inset-focus:focus { box-shadow: 8px 8px 16px rgba(0,0,0,0.15), -8px -8px 16px rgba(255,255,255,0.7); outline: none; }
    .transition-clay { transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .clay-outer { box-shadow: 20px 20px 25px 0px rgba(0,0,0,0.15), -20px -20px 20px 0px rgba(255,255,255,0.6); }
    .clay-error-outer { box-shadow: 20px 20px 25px 0px rgba(186,26,26,0.1), -20px -20px 20px 0px rgba(255,255,255,0.8); }
    .clay-outer-bubble { box-shadow: 10px 10px 15px 0px rgba(0,0,0,0.1), -10px -10px 15px 0px rgba(255,255,255,0.7); }
    {% block extra_css %}{% endblock %}
</style>
</head>
<body class="{% block body_class %}bg-background text-on-background font-body-md min-h-screen{% endblock %}">
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
