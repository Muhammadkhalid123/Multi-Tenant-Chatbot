<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Suspended Chat Widget</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#dee1ff",
                        "surface-dim": "#dcd9d9",
                        "on-primary-container": "#002088",
                        "secondary-fixed": "#ccebc2",
                        "inverse-on-surface": "#f3f0f0",
                        "on-background": "#1b1c1c",
                        "primary-container": "#7b8ff7",
                        "surface-tint": "#4156ba",
                        "on-surface-variant": "#454652",
                        "surface-container": "#f0eded",
                        "on-surface": "#1b1c1c",
                        "inverse-surface": "#303030",
                        "on-tertiary-fixed": "#331101",
                        "tertiary-container": "#c4896b",
                        "tertiary": "#845238",
                        "primary": "#4156ba",
                        "on-secondary-fixed-variant": "#334d2f",
                        "outline-variant": "#c5c5d4",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#eae8e7",
                        "surface": "#fbf9f8",
                        "tertiary-fixed-dim": "#f9b898",
                        "background": "#fbf9f8",
                        "outline": "#757684",
                        "on-secondary-container": "#4f6a49",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#001159",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#082007",
                        "on-tertiary-container": "#4c240e",
                        "primary-fixed-dim": "#b9c3ff",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#683b23",
                        "surface-bright": "#fbf9f8",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e4e2e1",
                        "tertiary-fixed": "#ffdbcb",
                        "secondary-fixed-dim": "#b1cfa7",
                        "surface-container-low": "#f6f3f2",
                        "on-primary-fixed-variant": "#263ca1",
                        "inverse-primary": "#b9c3ff",
                        "surface-variant": "#e4e2e1",
                        "on-primary": "#ffffff",
                        "secondary-container": "#c9e8bf",
                        "secondary": "#4a6545"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "unit": "8px",
                        "lg": "40px",
                        "sm": "12px",
                        "margin-desktop": "48px",
                        "xl": "64px",
                        "md": "24px",
                        "margin-mobile": "16px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "headline-xl": ["Quicksand"],
                        "label-sm": ["Quicksand"],
                        "body-md": ["Quicksand"],
                        "body-lg": ["Quicksand"],
                        "headline-md": ["Quicksand"],
                        "headline-lg": ["Quicksand"]
                    },
                    "fontSize": {
                        "headline-xl": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .clay-outer {
            box-shadow: 20px 20px 25px 0px rgba(0,0,0,0.15), -20px -20px 20px 0px rgba(255,255,255,0.6);
        }
        .clay-outer-bubble {
            box-shadow: 10px 10px 15px 0px rgba(0,0,0,0.1), -10px -10px 15px 0px rgba(255,255,255,0.7);
        }
        .clay-inset {
            box-shadow: inset 5px 5px 10px 0px rgba(0,0,0,0.1), inset -5px -5px 10px 0px rgba(255,255,255,0.7);
        }
    </style>
</head>
<body class="h-full bg-[#EEF0F7] font-body-md text-on-surface flex items-center justify-center p-4">
<!-- Mockup of Mobile Chat Widget Container -->
<div class="relative w-full max-w-[375px] h-[700px] max-h-[90vh] bg-[#fdfcff] rounded-[40px] clay-outer flex flex-col overflow-hidden">
<!-- Header -->
<div class="px-6 pt-8 pb-4 bg-white/80 backdrop-blur-md z-10 border-b border-white/50 flex items-center justify-between shadow-[0px_10px_20px_-10px_rgba(0,0,0,0.05)]">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center clay-outer-bubble">
<span class="material-symbols-outlined text-primary font-headline-md">support_agent</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Brand Support</h2>
<p class="font-label-sm text-label-sm text-outline flex items-center gap-1">
<span class="w-2 h-2 rounded-full bg-outline-variant"></span>
                        Offline
                    </p>
</div>
</div>
<button class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center clay-outer-bubble text-on-surface-variant hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Chat Area -->
<div class="flex-1 overflow-y-auto p-6 flex flex-col justify-end bg-gradient-to-b from-[#fdfcff] to-[#f4f5f9]">
<!-- Suspended Message Bubble -->
<div class="flex items-end gap-2 mb-6">
<div class="w-8 h-8 rounded-full bg-surface-variant flex-shrink-0 flex items-center justify-center border-2 border-white clay-outer-bubble">
<span class="material-symbols-outlined text-[16px] text-outline">smart_toy</span>
</div>
<div class="bg-surface-container-high text-on-surface-variant px-5 py-4 rounded-t-[20px] rounded-br-[20px] rounded-bl-[4px] max-w-[85%] clay-outer-bubble border border-white/40">
<p class="font-body-md text-body-md">This chat is temporarily unavailable. Please check back soon.</p>
</div>
</div>
<div class="text-center w-full mb-2">
<span class="font-label-sm text-label-sm text-outline-variant uppercase tracking-wider">Chat Suspended</span>
</div>
</div>
<!-- Input Area (Disabled) -->
<div class="p-6 pb-8 bg-white/50 backdrop-blur-sm z-10">
<div class="relative flex items-center">
<input class="w-full bg-surface-container-highest text-outline-variant placeholder-outline-variant px-5 py-4 rounded-full font-body-md text-body-md border-none focus:ring-0 clay-inset cursor-not-allowed opacity-70" disabled="" placeholder="Chat unavailable..." type="text"/>
<div class="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center opacity-50 cursor-not-allowed">
<span class="material-symbols-outlined text-outline">send</span>
</div>
</div>
</div>
</div>
</body></html>
