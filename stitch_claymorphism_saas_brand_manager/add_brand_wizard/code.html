<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Brand Wizard - Step 1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-fixed": "#dee1ff",
                        "surface-dim": "#dcd9d9",
                        "on-primary-container": "#002088",
                        "secondary-fixed": "#ccebc2",
                        "inverse-on-surface": "#f3f0f0",
                        "on-background": "#1b1c1c",
                        "primary-container": "#7b8ff7",
                        "surface-tint": "#4156ba",
                        "on-surface-variant": "#454652",
                        "surface-container": "#f0eded",
                        "on-surface": "#1b1c1c",
                        "inverse-surface": "#303030",
                        "on-tertiary-fixed": "#331101",
                        "tertiary-container": "#c4896b",
                        "tertiary": "#845238",
                        "primary": "#4156ba",
                        "on-secondary-fixed-variant": "#334d2f",
                        "outline-variant": "#c5c5d4",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#eae8e7",
                        "surface": "#fbf9f8",
                        "tertiary-fixed-dim": "#f9b898",
                        "background": "#fbf9f8",
                        "outline": "#757684",
                        "on-secondary-container": "#4f6a49",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#001159",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#082007",
                        "on-tertiary-container": "#4c240e",
                        "primary-fixed-dim": "#b9c3ff",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#683b23",
                        "surface-bright": "#fbf9f8",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e4e2e1",
                        "tertiary-fixed": "#ffdbcb",
                        "secondary-fixed-dim": "#b1cfa7",
                        "surface-container-low": "#f6f3f2",
                        "on-primary-fixed-variant": "#263ca1",
                        "inverse-primary": "#b9c3ff",
                        "surface-variant": "#e4e2e1",
                        "on-primary": "#ffffff",
                        "secondary-container": "#c9e8bf",
                        "secondary": "#4a6545"
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px",
                        "clay": "28px"
                    },
                    spacing: {
                        "gutter": "24px",
                        "unit": "8px",
                        "lg": "40px",
                        "sm": "12px",
                        "margin-desktop": "48px",
                        "xl": "64px",
                        "md": "24px",
                        "margin-mobile": "16px",
                        "xs": "4px"
                    },
                    fontFamily: {
                        "headline-xl": ["Quicksand"],
                        "label-sm": ["Quicksand"],
                        "body-md": ["Quicksand"],
                        "body-lg": ["Quicksand"],
                        "headline-md": ["Quicksand"],
                        "headline-lg": ["Quicksand"]
                    },
                    fontSize: {
                        "headline-xl": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .clay-shadow {
            box-shadow: 20px 20px 25px 0px rgba(0, 0, 0, 0.15), -20px -20px 20px 0px rgba(255, 255, 255, 0.6);
        }
        .clay-inset {
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.1), inset -4px -4px 8px rgba(255,255,255,0.8);
        }
        .clay-inset-focus:focus {
            box-shadow: 8px 8px 16px rgba(0,0,0,0.15), -8px -8px 16px rgba(255,255,255,0.7);
            outline: none;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop relative">
<!-- Dimmed Background Overlay -->
<div class="fixed inset-0 bg-on-background/20 backdrop-blur-sm z-0"></div>
<!-- Main Modal Card -->
<div class="relative z-10 w-full max-w-2xl bg-surface rounded-clay p-lg md:p-xl clay-shadow border border-white/50">
<!-- Header & Step Indicator -->
<div class="mb-lg">
<h1 class="font-headline-lg text-headline-lg text-on-background mb-md">Add New Brand</h1>
<div class="flex items-center gap-sm">
<!-- Step 1: Active -->
<div class="flex-1 h-2 bg-primary rounded-full clay-shadow"></div>
<!-- Step 2: Inactive -->
<div class="flex-1 h-2 bg-surface-variant rounded-full clay-inset"></div>
<!-- Step 3: Inactive -->
<div class="flex-1 h-2 bg-surface-variant rounded-full clay-inset"></div>
</div>
<div class="flex justify-between mt-sm text-on-surface-variant">
<span class="font-label-sm text-label-sm text-primary">Brand Info</span>
<span class="font-label-sm text-label-sm">Branding</span>
<span class="font-label-sm text-label-sm">Knowledge Base</span>
</div>
</div>
<!-- Form Fields -->
<form class="space-y-md">
<!-- Brand Name -->
<div class="flex flex-col gap-xs">
<label class="font-body-md text-body-md text-on-surface ml-unit" for="brandName">Brand Name</label>
<input class="w-full bg-surface-container rounded-full px-md py-sm font-body-lg text-body-lg text-on-background border-none clay-inset clay-inset-focus transition-all duration-200" id="brandName" placeholder="e.g., ChatPulse Inc." type="text"/>
</div>
<!-- Owner Email -->
<div class="flex flex-col gap-xs">
<label class="font-body-md text-body-md text-on-surface ml-unit" for="ownerEmail">Owner Email</label>
<input class="w-full bg-surface-container rounded-full px-md py-sm font-body-lg text-body-lg text-on-background border-none clay-inset clay-inset-focus transition-all duration-200" id="ownerEmail" placeholder="admin@brand.com" type="email"/>
</div>
<!-- Bot ID/Slug -->
<div class="flex flex-col gap-xs">
<label class="font-body-md text-body-md text-on-surface ml-unit" for="botSlug">Bot ID / Slug</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-md text-on-surface-variant font-body-lg text-body-lg">@</span>
<input class="w-full bg-surface-container rounded-full pl-xl pr-md py-sm font-body-lg text-body-lg text-on-background border-none clay-inset clay-inset-focus transition-all duration-200" id="botSlug" placeholder="brand-bot" type="text"/>
</div>
<p class="font-label-sm text-label-sm text-outline ml-unit mt-xs">This will be used for unique bot links and API access.</p>
</div>
</form>
<!-- Navigation Buttons -->
<div class="mt-xl pt-md flex justify-between items-center border-t border-surface-container-high/50">
<button class="font-body-lg text-body-lg text-on-surface-variant hover:text-primary transition-colors px-md py-sm rounded-full hover:bg-surface-container" type="button">
                Cancel
            </button>
<button class="bg-primary text-on-primary font-body-lg text-body-lg px-xl py-sm rounded-full clay-shadow hover:scale-[1.02] active:scale-95 transition-all duration-200 flex items-center gap-sm" type="button">
                Next
                <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</div>
</body></html>
